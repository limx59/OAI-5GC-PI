NearRT_RIC_IP = "127.0.0.1"
E42_Port = 36422

Sub_ORAN_SM_List = (
    { name = "KPM", time = 1000,
      format = 4,
      ran_type = "ngran_gNB",
      actions = (
          { name = "DRB.UEThpDl" },
          { name = "DRB.UEThpUl" }
      )
