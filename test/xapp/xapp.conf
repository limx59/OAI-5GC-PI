)

Sub_CUST_SM_List = (
    { name = "MAC", time = "100_ms" },
    { name = "RLC", time = "100_ms" },
    { name = "PDCP", time = "100_ms" }
)

xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "xapp-demo"
    username = ""
    password = ""
}
