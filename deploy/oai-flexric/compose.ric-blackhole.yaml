services:
  emulator:
    image: limx59/flexric-emulator:arm64-ric-blackhole
    build:
      context: ../..
      dockerfile: docker/flexric/Dockerfile.ric-blackhole-agent
      target: emulator
    environment:
      RIC_BLACKHOLE_TEST: "1"

  emulator-2:
    image: limx59/flexric-emulator:arm64-ric-blackhole
    build:
      context: ../..
      dockerfile: docker/flexric/Dockerfile.ric-blackhole-agent
      target: emulator
    environment:
      RIC_BLACKHOLE_TEST: "1"
