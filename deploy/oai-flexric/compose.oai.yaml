name: oai-pi-oai-e2-lab

x-xapp: &xapp
  image: limx59/flexric-xapp:arm64
  build:
    context: ../..
    dockerfile: docker/flexric/Dockerfile
    target: xapp
    args:
      BUILD_JOBS: "2"
  profiles: ["tools"]
  networks:
    - lab
  volumes:
    - ./config/oai/xapp.conf:/usr/local/etc/flexric/xapp.conf:ro
  restart: "no"

services:
  ric:
    image: limx59/flexric-ric:arm64
    build:
      context: ../..
      dockerfile: docker/flexric/Dockerfile
      target: ric
      args:
        BUILD_JOBS: "2"
    networks:
      lab:
        ipv4_address: 172.29.0.10
    volumes:
      - ./config/oai/ric.conf:/usr/local/etc/flexric/ric.conf:ro
    stop_signal: SIGINT
    stop_grace_period: 10s
    restart: "no"

  gnb:
    image: limx59/oai-gnb:arm64
    cpuset: "${OAI_RAN_CPUSET:-1-3}"
    build:
      context: ../..
      dockerfile: docker/oai/Dockerfile
      target: gnb
      args:
        BUILD_JOBS: "2"
    depends_on:
      - ric
    networks:
      lab:
        ipv4_address: 172.29.0.30
      core:
        ipv4_address: 172.22.0.150
    volumes:
      - ./config/oai:/etc/oai:ro
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock:
        soft: -1
        hard: -1
      rtprio:
        soft: 99
        hard: 99
      core:
        soft: 0
        hard: 0
    stop_signal: SIGINT
    stop_grace_period: 15s
    restart: "no"

  nrue:
    image: limx59/oai-nr-ue:arm64
    cpuset: "${OAI_RAN_CPUSET:-1-3}"
    build:
      context: ../..
      dockerfile: docker/oai/Dockerfile
      target: nrue
      args:
        BUILD_JOBS: "2"
    profiles: ["ue"]
    depends_on:
      - gnb
    networks:
      - lab
    volumes:
      - ./config/oai/ue.conf:/etc/oai/ue.conf:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock:
        soft: -1
        hard: -1
      rtprio:
        soft: 99
        hard: 99
      core:
        soft: 0
        hard: 0
    command:
      - "-O"
      - "/etc/oai/ue.conf"
      - "--rfsim"
      - "-C"
      - "3619200000"
      - "-r"
      - "106"
      - "--numerology"
      - "1"
      - "--ssb"
      - "516"
    stop_signal: SIGINT
    stop_grace_period: 15s
    restart: "no"

  xapp-nodes:
    <<: *xapp
    command: ["xapp_nodes.py", "-c", "/usr/local/etc/flexric/xapp.conf"]

  xapp-kpm:
    <<: *xapp
    command: ["xapp_kpm.py", "-c", "/usr/local/etc/flexric/xapp.conf"]

networks:
  lab:
    external: true
    name: oai-pi-flexric-lab
  core:
    external: true
    name: docker_open5gs_default
