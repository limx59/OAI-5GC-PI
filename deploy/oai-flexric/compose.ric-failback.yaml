services:
  emulator:
    image: limx59/flexric-emulator:arm64-ric-failback
    build:
      context: ../..
      dockerfile: docker/flexric/Dockerfile.ric-failback-agent
      target: emulator
    environment:
      RIC_FAILBACK_TEST: "1"

  emulator-2:
    image: limx59/flexric-emulator:arm64-ric-failback
    build:
      context: ../..
      dockerfile: docker/flexric/Dockerfile.ric-failback-agent
      target: emulator
    environment:
      RIC_FAILBACK_TEST: "1"
