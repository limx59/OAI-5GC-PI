services:
  dual-node-collector:
    image: oai-pi-ocudu-flexric-xapp:arm64-steering-dual-node-test
    pull_policy: never
    environment:
      OAI_PI_KPM_REPORT_STYLE: "4"
      KPM_RECORD_SECONDS: "45"
      XAPP_OUTPUT: /evidence/kpm.csv
      PROBE_OUTPUT: /evidence/probe.json
    volumes:
      - type: bind
        source: "${OCUDU_DUAL_EVIDENCE:?Set evidence directory}"
        target: /evidence
      - type: bind
        source: "${OCUDU_DUAL_CONFIG:?Set configuration directory}/xapp.conf"
        target: /usr/local/etc/flexric/xapp.conf
        read_only: true
    networks:
      - core
    ulimits:
      core: 0
    stop_signal: SIGINT
    stop_grace_period: 20s
    restart: "no"
